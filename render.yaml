# Worksetu — Render Blueprint. Deploys both services from one repo:
#   worksetu-api    — Express/TypeScript backend (persistent Node process —
#                      required: Socket.io live dispatch push, node-cron
#                      jobs, and the dispatch engine's in-process
#                      setTimeout/setInterval offer-timeout windows do not
#                      survive on stateless serverless functions).
#   worksetu-web    — the static frontend (index.html/app.js/api.js/
#                      mockData.js/translations.js), staged into its own
#                      output dir at build time so the backend's TypeScript
#                      source, .git history, and internal docs are never
#                      published alongside it.
#
# Database: intentionally NOT provisioned here. This project already runs
# against an existing, migrated, PostGIS-enabled, seeded Supabase Postgres
# (DATABASE_URL/DIRECT_URL below) — a Render Blueprint `databases:` entry
# always provisions a brand-new empty Postgres instance, which would mean
# re-running migrations and seed data from scratch. Point DATABASE_URL/
# DIRECT_URL at your existing Supabase project instead (set as secrets
# below). If you later want Render to own the database instead, add a
# `databases:` block and repoint these two vars at its connection strings.

services:
  - type: web
    name: worksetu-api
    env: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run prisma:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # existing Supabase pooled connection string (?pgbouncer=true)
      - key: DIRECT_URL
        sync: false # existing Supabase direct connection string (for `prisma migrate` only)
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false # existing Upstash Redis connection string
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the worksetu-web URL below once known, e.g. https://worksetu-web.onrender.com

  - type: web
    name: worksetu-web
    env: static
    rootDir: .
    buildCommand: mkdir -p dist && cp index.html app.js api.js mockData.js translations.js worksetu_logo.png worksetu-logo-wordmark.jpg dist/
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
